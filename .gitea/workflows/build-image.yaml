name: Build container image
on:
  pull_request:
    branches:
      - develop
  schedule:
    - cron: '05 08 * * *'  # 08:05am UTC everyday
  push:
    branches:
      - develop
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:


concurrency:
  group: build-cobaltrush
  cancel-in-progress: true

env:
  IMAGE_DESC: "CobaltRush - A bluefin-dx hyprland derivative"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ gitea.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "registry.wabash.place/${{ gitea.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

jobs:
  build:
    name: Build image
    runs-on: buildah

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Prepare environment
      run: |
        # Lowercase the image uri
        echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
        echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

    - name: Checkout
      env:
        REPO_TOKEN: ${{ gitea.token }}
      run: |
        REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        CLONE_URL="${GITHUB_SERVER_URL/https:\/\//https:\/\/token:${REPO_TOKEN}@}"
        git clone --depth 1 -b "${REF}" \
          "${CLONE_URL}/${GITHUB_REPOSITORY}.git" .

    - name: Generate image metadata
      id: metadata
      run: |
        DATE=$(date -u +%Y%m%d)
        SHA_SHORT="${GITHUB_SHA:0:7}"

        TAGS="${DEFAULT_TAG} ${DEFAULT_TAG}.${DATE} ${DATE}"
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          PR_NUM=$(echo "${GITHUB_REF}" | grep -oP '(?<=refs/pull/)\d+')
          TAGS="${TAGS} sha-${SHA_SHORT} pr-${PR_NUM}"
        fi
        echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

        # Multiline labels output
        {
          echo "labels<<LABELS_EOF"
          printf '%s\n' \
            "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}/refs/heads/main/README.md" \
            "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "org.opencontainers.image.description=${IMAGE_DESC}" \
            "org.opencontainers.image.documentation=https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}/refs/heads/main/README.md" \
            "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}/blob/main/Containerfile" \
            "org.opencontainers.image.title=${IMAGE_NAME}" \
            "org.opencontainers.image.url=https://github.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" \
            "org.opencontainers.image.vendor=${GITHUB_REPOSITORY_OWNER}" \
            "org.opencontainers.image.version=${DEFAULT_TAG}.${DATE}" \
            "io.artifacthub.package.deprecated=false" \
            "io.artifacthub.package.keywords=${IMAGE_KEYWORDS}" \
            "io.artifacthub.package.license=Apache-2.0" \
            "io.artifacthub.package.logo-url=${IMAGE_LOGO_URL}" \
            "io.artifacthub.package.prerelease=false" \
            "containers.bootc=1"
          echo "LABELS_EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Build Image
      id: build_image
      env:
        META_TAGS: ${{ steps.metadata.outputs.tags }}
        META_LABELS: ${{ steps.metadata.outputs.labels }}
      run: |
        TAG_ARGS=()
        for tag in ${META_TAGS}; do
          TAG_ARGS+=("-t" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")
        done

        LABEL_ARGS=()
        while IFS= read -r label; do
          [ -n "$label" ] && LABEL_ARGS+=("--label" "$label")
        done <<< "${META_LABELS}"

        podman build \
          --pull=always \
          --layers=true \
          "${TAG_ARGS[@]}" \
          "${LABEL_ARGS[@]}" \
          -f ./Containerfile .

    - name: Push To Registry
      id: push
      env:
        META_TAGS: ${{ steps.metadata.outputs.tags }}
      run: |
        for tag in ${META_TAGS}; do
          podman push "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
        done

    - name: Install Cosign
      if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        curl -sSfL "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" \
          -o /usr/local/bin/cosign
        chmod +x /usr/local/bin/cosign

    - name: Sign container image
      if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      env:
        COSIGN_PASSWORD: ""
        COSIGN_EXPERIMENTAL: false
        COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
      run: |
        IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
        for tag in ${{ steps.metadata.outputs.tags }}; do
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}:${tag}"
        done
